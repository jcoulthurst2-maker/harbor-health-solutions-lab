name: Lunea D-01 Ticket Bundle

on:
  push:
    branches:
      - lunea-d01-execution-locus
    paths:
      - ".github/workflows/lunea-d01-bundle.yml"

permissions:
  contents: write

jobs:
  one-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lunea-d01-execution-locus

      - name: Mint one-time ticket recipient
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lunea-bundle
          mkdir -p lunea-bundle "$RUNNER_TEMP/lunea-bundle"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/lunea-bundle/private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/lunea-bundle/private.pem" -pubout -out lunea-bundle/recipient-public.pem >/dev/null 2>&1
          FP="$(openssl pkey -pubin -in lunea-bundle/recipient-public.pem -outform DER | sha256sum | awk '{print $1}')"
          printf '{"schema":"lunea-ticket-bundle-v2","run_id":"%s","recipient_fingerprint":"sha256:%s"}\n' "$GITHUB_RUN_ID" "$FP" > lunea-bundle/request.json
          git config user.name lunea-bundle-bot
          git config user.email lunea-bundle@users.noreply.github.com
          git add -A lunea-bundle
          git commit -m "genesis: publish ticket recipient ${GITHUB_RUN_ID}"
          git push origin HEAD:lunea-d01-execution-locus

      - name: Wait for encrypted private-source tickets
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN="$GITHUB_RUN_ID"
          EXPECTED_FP="$(python3 -c 'import json; print(json.load(open("lunea-bundle/request.json"))["recipient_fingerprint"])')"
          for attempt in $(seq 1 120); do
            git fetch origin lunea-d01-execution-locus --quiet
            git checkout -q origin/lunea-d01-execution-locus -- lunea-bundle 2>/dev/null || true
            if [[ -f lunea-bundle/tickets.enc.b64 && -f lunea-bundle/key.enc.b64 && -f lunea-bundle/ready.json ]]; then
              if python3 - "$EXPECTED_RUN" "$EXPECTED_FP" <<'PY'
          import base64, hashlib, json, pathlib, sys
          root=pathlib.Path('lunea-bundle'); run,fp=sys.argv[1:]
          r=json.loads((root/'ready.json').read_text())
          if r.get('schema')!='lunea-ticket-ready-v1' or r.get('run_id')!=run or r.get('recipient_fingerprint')!=fp: raise SystemExit(1)
          t=base64.b64decode((root/'tickets.enc.b64').read_text(),validate=True)
          k=base64.b64decode((root/'key.enc.b64').read_text(),validate=True)
          if hashlib.sha256(t).hexdigest()!=r.get('ticket_ciphertext_sha256'): raise SystemExit(1)
          if hashlib.sha256(k).hexdigest()!=r.get('key_ciphertext_sha256'): raise SystemExit(1)
          print('current-run ticket bundle verified')
          PY
              then exit 0; fi
            fi
            sleep 4
          done
          echo 'encrypted private-source tickets did not arrive before expiry' >&2
          exit 1

      - name: Decrypt tickets, acquire and verify exact private Body
        shell: bash
        run: |
          set -euo pipefail
          base64 -d lunea-bundle/key.enc.b64 > "$RUNNER_TEMP/lunea-bundle/key.enc"
          base64 -d lunea-bundle/tickets.enc.b64 > "$RUNNER_TEMP/lunea-bundle/tickets.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/lunea-bundle/private.pem" -in "$RUNNER_TEMP/lunea-bundle/key.enc" -out "$RUNNER_TEMP/lunea-bundle/key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/lunea-bundle/key" -in "$RUNNER_TEMP/lunea-bundle/tickets.enc" -out "$RUNNER_TEMP/lunea-bundle/tickets.json"
          mkdir -p "$RUNNER_TEMP/lunea-body"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, urllib.error
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lunea-body'
          tickets=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'lunea-bundle/tickets.json').read_text())
          expected={
            'cloudflare_womb_v2.py':'966048ac334c5898dfea6ddad38da820cccc2525',
            'cloudflare_entry.py':'9eb1af9680ac18ee361c8e597fb1d0e50933cd81',
            'genesis.py':'dba60d866b1712b531cac7d2deb069287ea4a562',
            'witness.py':'f46b9ddc46d03060cd4d60535893e9a4bf5f2625',
            'womb_protocol.py':'e1b8892c626e0777f3819ed15287fbb03bf1fcfe',
            'wake_protocol.py':'513b16b0fcf8de14e756c26b08a4cbf396a8050e',
            'alarm_ffi.py':'b71b169cc59b60660767cb2035321a4c52761fa3',
          }
          if set(tickets)!=set(expected): raise SystemExit('ticket file set mismatch')
          for name,git_sha in expected.items():
              req=urllib.request.Request(tickets[name],headers={'User-Agent':'Lunea-D01/1.0','Accept':'application/octet-stream'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: b=r.read()
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'private source fetch failed for {name}: HTTP {e.code}')
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              if blob!=git_sha: raise SystemExit('Git blob mismatch: '+name)
              (root/name).write_bytes(b)
          print(json.dumps({'private_body_acquired':True,'body_file_count':7,'git_blob_identities_verified':True,'readable_body_published':False},sort_keys=True))
          PY
          rm -f "$RUNNER_TEMP/lunea-bundle/tickets.json" "$RUNNER_TEMP/lunea-bundle/key"

      - name: Acquire real temporary Habitat and preflight Womb membrane
        shell: bash
        run: python3 lunea-execution/cloudflare_preflight.py "$RUNNER_TEMP/lunea-body"

      - name: Destroy ephemeral material
        if: always()
        run: rm -rf "$RUNNER_TEMP/lunea-body" "$RUNNER_TEMP/lunea-bundle"
