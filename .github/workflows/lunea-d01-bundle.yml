# D-01 provider probe revision: frontier-1-evidence-bound-reconstitution-v15
name: Lunea D-01 One Bundle

on:
  push:
    branches:
      - lunea-d01-execution-locus
    paths:
      - ".github/workflows/lunea-d01-bundle.yml"

permissions:
  contents: write

concurrency:
  group: lunea-d01-one-bundle
  cancel-in-progress: false

jobs:
  one-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lunea-d01-execution-locus

      - name: Mint isolated one-time recipient
        shell: bash
        run: |
          set -euo pipefail
          RENDEZVOUS="lunea-rendezvous/${GITHUB_RUN_ID}"
          TEMP="$RUNNER_TEMP/lunea-rendezvous"
          mkdir -p "$RENDEZVOUS" "$TEMP"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$TEMP/private.pem" >/dev/null 2>&1
          openssl pkey -in "$TEMP/private.pem" -pubout -out "$RENDEZVOUS/recipient-public.pem" >/dev/null 2>&1
          FP="$(openssl pkey -pubin -in "$RENDEZVOUS/recipient-public.pem" -outform DER | sha256sum | awk '{print $1}')"
          printf '{"schema":"lunea-run-isolated-v1","run_id":"%s","recipient_fingerprint":"sha256:%s"}\n' "$GITHUB_RUN_ID" "$FP" > "$RENDEZVOUS/request.json"
          git config user.name lunea-bundle-bot
          git config user.email lunea-bundle@users.noreply.github.com
          git add "$RENDEZVOUS"
          git commit -m "genesis: publish isolated Body recipient ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:lunea-d01-execution-locus; then exit 0; fi
            git fetch origin lunea-d01-execution-locus --quiet
            git rebase origin/lunea-d01-execution-locus
            sleep 1
          done
          exit 1

      - name: Wait for isolated hash-bound Body bundle
        shell: bash
        run: |
          set -euo pipefail
          RENDEZVOUS="lunea-rendezvous/${GITHUB_RUN_ID}"
          EXPECTED_RUN="$GITHUB_RUN_ID"
          EXPECTED_FP="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["recipient_fingerprint"])' "$RENDEZVOUS/request.json")"
          for attempt in $(seq 1 150); do
            git fetch origin lunea-d01-execution-locus:refs/remotes/origin/lunea-d01-execution-locus --quiet
            git checkout -q origin/lunea-d01-execution-locus -- "$RENDEZVOUS" 2>/dev/null || true
            if [[ -f "$RENDEZVOUS/envelope.json" && -f "$RENDEZVOUS/body.tar.gz.enc.b64" && -f "$RENDEZVOUS/key.enc.b64" && -f "$RENDEZVOUS/ready.json" ]]; then
              if python3 - "$RENDEZVOUS" "$EXPECTED_RUN" "$EXPECTED_FP" <<'PY'
          import base64, hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); run=sys.argv[2]; fp=sys.argv[3]
          ready=json.loads((root/'ready.json').read_text()); env=json.loads((root/'envelope.json').read_text())
          if ready.get('schema')!='lunea-body-isolated-ready-v1': raise SystemExit(1)
          if ready.get('run_id')!=run or env.get('run_id')!=run: raise SystemExit(1)
          if ready.get('recipient_fingerprint')!=fp or env.get('recipient_fingerprint')!=fp: raise SystemExit(1)
          body=base64.b64decode((root/'body.tar.gz.enc.b64').read_text(),validate=True)
          key=base64.b64decode((root/'key.enc.b64').read_text(),validate=True)
          if hashlib.sha256(body).hexdigest()!=ready.get('body_ciphertext_sha256'): raise SystemExit(1)
          if hashlib.sha256(key).hexdigest()!=ready.get('key_ciphertext_sha256'): raise SystemExit(1)
          if env.get('body_ciphertext_sha256')!=ready.get('body_ciphertext_sha256'): raise SystemExit(1)
          if env.get('key_ciphertext_sha256')!=ready.get('key_ciphertext_sha256'): raise SystemExit(1)
          print('isolated current-run Body bundle verified')
          PY
              then exit 0; fi
            fi
            sleep 4
          done
          echo 'isolated Body bundle did not arrive before expiry' >&2
          exit 1

      - name: Decrypt and verify exact private Body
        shell: bash
        run: |
          set -euo pipefail
          RENDEZVOUS="lunea-rendezvous/${GITHUB_RUN_ID}"
          TEMP="$RUNNER_TEMP/lunea-rendezvous"
          base64 -d "$RENDEZVOUS/key.enc.b64" > "$TEMP/key.enc"
          base64 -d "$RENDEZVOUS/body.tar.gz.enc.b64" > "$TEMP/body.tar.gz.enc"
          openssl pkeyutl -decrypt -inkey "$TEMP/private.pem" -in "$TEMP/key.enc" -out "$TEMP/key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$TEMP/key" -in "$TEMP/body.tar.gz.enc" -out "$TEMP/body.tar.gz"
          gzip -t "$TEMP/body.tar.gz"
          mkdir -p "$RUNNER_TEMP/lunea-body"
          tar -xzf "$TEMP/body.tar.gz" -C "$RUNNER_TEMP/lunea-body"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lunea-body'; m=json.loads((root/'manifest.json').read_text())
          expected={'cloudflare_womb_v2.py':'d1f7ac2facdeb6eb2a30ed80e80785074886032a','cloudflare_entry.py':'c9b758870c7f2108b20aab3f49ea8b77c0423004','genesis.py':'dba60d866b1712b531cac7d2deb069287ea4a562','witness.py':'f46b9ddc46d03060cd4d60535893e9a4bf5f2625','womb_protocol.py':'e1b8892c626e0777f3819ed15287fbb03bf1fcfe','wake_protocol.py':'513b16b0fcf8de14e756c26b08a4cbf396a8050e','reconstitution.py':'1be9ed1f84be973e44631f263cb0c987859327a1','alarm_ffi.py':'b71b169cc59b60660767cb2035321a4c52761fa3'}
          files={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest.json'}
          if files!=set(expected) or set(m.get('files',{}))!=set(expected): raise SystemExit('exact Body file set mismatch')
          for name,sha in expected.items():
              b=(root/name).read_bytes(); blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              if blob!=sha or m['files'][name].get('git_blob_sha')!=sha or hashlib.sha256(b).hexdigest()!=m['files'][name].get('sha256'): raise SystemExit('Body identity mismatch: '+name)
          print(json.dumps({'private_body_acquired':True,'body_file_count':8,'git_blob_identities_verified':True,'readable_body_published':False},sort_keys=True))
          PY

      - name: Run direct real Habitat evidence-bound Gestation proof
        shell: bash
        env:
          PYTHONPATH: lunea-execution
        run: python3 lunea-execution/frontier1_direct.py "$RUNNER_TEMP/lunea-body"

      - name: Destroy ephemeral material
        if: always()
        run: rm -rf "$RUNNER_TEMP/lunea-body" "$RUNNER_TEMP/lunea-rendezvous"
