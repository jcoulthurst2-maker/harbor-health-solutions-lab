name: Lunea D-01 One Bundle

on:
  push:
    branches:
      - lunea-d01-execution-locus
    paths:
      - ".github/workflows/lunea-d01-bundle.yml"

permissions:
  contents: write

jobs:
  one-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lunea-d01-execution-locus

      - name: Mint one-time recipient and clear stale response
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lunea-bundle
          mkdir -p lunea-bundle "$RUNNER_TEMP/lunea-bundle"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/lunea-bundle/private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/lunea-bundle/private.pem" -pubout -out lunea-bundle/recipient-public.pem >/dev/null 2>&1
          FP="$(openssl pkey -pubin -in lunea-bundle/recipient-public.pem -outform DER | sha256sum | awk '{print $1}')"
          printf '{"schema":"lunea-one-bundle-v5","run_id":"%s","recipient_fingerprint":"sha256:%s"}\n' "$GITHUB_RUN_ID" "$FP" > lunea-bundle/request.json
          git config user.name lunea-bundle-bot
          git config user.email lunea-bundle@users.noreply.github.com
          git add -A lunea-bundle
          git commit -m "genesis: publish clean one-time Body recipient ${GITHUB_RUN_ID}"
          git push origin HEAD:lunea-d01-execution-locus

      - name: Wait for complete hash-bound Body bundle
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN="$GITHUB_RUN_ID"
          EXPECTED_FP="$(python3 -c 'import json; print(json.load(open("lunea-bundle/request.json"))["recipient_fingerprint"])')"
          for attempt in $(seq 1 120); do
            git fetch origin lunea-d01-execution-locus --quiet
            git checkout -q origin/lunea-d01-execution-locus -- lunea-bundle 2>/dev/null || true
            if [[ -f lunea-bundle/envelope.json && -f lunea-bundle/body.tar.gz.enc.b64 && -f lunea-bundle/key.enc.b64 && -f lunea-bundle/ready.json ]]; then
              if python3 - "$EXPECTED_RUN" "$EXPECTED_FP" <<'PY'
          import base64, hashlib, json, pathlib, sys
          root=pathlib.Path('lunea-bundle')
          expected_run, expected_fp=sys.argv[1:]
          ready=json.loads((root/'ready.json').read_text())
          envelope=json.loads((root/'envelope.json').read_text())
          if ready.get('schema')!='lunea-body-bundle-ready-v1': raise SystemExit(1)
          if ready.get('run_id')!=expected_run or envelope.get('run_id')!=expected_run: raise SystemExit(1)
          if ready.get('recipient_fingerprint')!=expected_fp or envelope.get('recipient_fingerprint')!=expected_fp: raise SystemExit(1)
          body=base64.b64decode((root/'body.tar.gz.enc.b64').read_text(),validate=True)
          key=base64.b64decode((root/'key.enc.b64').read_text(),validate=True)
          if hashlib.sha256(body).hexdigest()!=ready.get('body_ciphertext_sha256'): raise SystemExit(1)
          if hashlib.sha256(key).hexdigest()!=ready.get('key_ciphertext_sha256'): raise SystemExit(1)
          if envelope.get('body_ciphertext_sha256')!=ready.get('body_ciphertext_sha256'): raise SystemExit(1)
          if envelope.get('key_ciphertext_sha256')!=ready.get('key_ciphertext_sha256'): raise SystemExit(1)
          print('complete current-run bundle verified')
          PY
              then
                exit 0
              fi
            fi
            sleep 4
          done
          echo 'complete hash-bound Body bundle did not arrive before expiry' >&2
          exit 1

      - name: Decrypt and verify exact private Body
        shell: bash
        run: |
          set -euo pipefail
          base64 -d lunea-bundle/key.enc.b64 > "$RUNNER_TEMP/lunea-bundle/key.enc"
          base64 -d lunea-bundle/body.tar.gz.enc.b64 > "$RUNNER_TEMP/lunea-bundle/body.tar.gz.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/lunea-bundle/private.pem" -in "$RUNNER_TEMP/lunea-bundle/key.enc" -out "$RUNNER_TEMP/lunea-bundle/key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/lunea-bundle/key" -in "$RUNNER_TEMP/lunea-bundle/body.tar.gz.enc" -out "$RUNNER_TEMP/lunea-bundle/body.tar.gz"
          mkdir -p "$RUNNER_TEMP/lunea-body"
          tar -xzf "$RUNNER_TEMP/lunea-bundle/body.tar.gz" -C "$RUNNER_TEMP/lunea-body"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lunea-body'
          m=json.loads((root/'manifest.json').read_text())
          expected={
            'cloudflare_womb_v2.py':'966048ac334c5898dfea6ddad38da820cccc2525',
            'cloudflare_entry.py':'9eb1af9680ac18ee361c8e597fb1d0e50933cd81',
            'genesis.py':'dba60d866b1712b531cac7d2deb069287ea4a562',
            'witness.py':'f46b9ddc46d03060cd4d60535893e9a4bf5f2625',
            'womb_protocol.py':'e1b8892c626e0777f3819ed15287fbb03bf1fcfe',
            'wake_protocol.py':'513b16b0fcf8de14e756c26b08a4cbf396a8050e',
            'alarm_ffi.py':'b71b169cc59b60660767cb2035321a4c52761fa3',
          }
          files={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest.json'}
          if files != set(expected): raise SystemExit('exact Body file set mismatch')
          if set(m.get('files',{})) != set(expected): raise SystemExit('manifest file set mismatch')
          for name,git_sha in expected.items():
              b=(root/name).read_bytes(); item=m['files'][name]
              if hashlib.sha256(b).hexdigest()!=item.get('sha256'): raise SystemExit('sha256 mismatch: '+name)
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              if item.get('git_blob_sha')!=git_sha or blob!=git_sha: raise SystemExit('Git blob mismatch: '+name)
          print(json.dumps({'private_body_acquired':True,'body_file_count':7,'manifest_verified':True,'git_blob_identities_verified':True,'readable_body_published':False},sort_keys=True))
          PY

      - name: Acquire real temporary Habitat and preflight Womb membrane
        shell: bash
        run: python3 lunea-execution/cloudflare_preflight.py "$RUNNER_TEMP/lunea-body"

      - name: Destroy ephemeral material
        if: always()
        run: rm -rf "$RUNNER_TEMP/lunea-body" "$RUNNER_TEMP/lunea-bundle"
