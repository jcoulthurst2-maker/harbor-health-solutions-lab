name: Lunea D-01 Execution Locus Probe

on:
  push:
    branches:
      - lunea-d01-execution-locus
    paths:
      - ".github/workflows/lunea-d01-locus.yml"
      - "lunea-handoff/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-time-body-rendezvous:
    name: One-Time Encrypted Body Rendezvous
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout execution locus
        uses: actions/checkout@v4
        with:
          ref: lunea-d01-execution-locus

      - name: Generate ephemeral recipient keypair
        shell: bash
        run: |
          set -euo pipefail
          rm -f lunea-handoff/recipient-public.pem lunea-handoff/rendezvous.json
          mkdir -p "$RUNNER_TEMP/lunea-rendezvous" lunea-handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/lunea-rendezvous/private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/lunea-rendezvous/private.pem" -pubout \
            -out lunea-handoff/recipient-public.pem >/dev/null 2>&1
          chmod 600 "$RUNNER_TEMP/lunea-rendezvous/private.pem"
          printf '{"schema":"lunea-body-rendezvous-v1","run_id":"%s","recipient":"rsa-3072","private_key_persisted":false,"transport":"chunked-base64-ciphertext-v2"}\n' \
            "$GITHUB_RUN_ID" > lunea-handoff/rendezvous.json

      - name: Publish public recipient only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lunea-rendezvous-bot"
          git config user.email "lunea-rendezvous@users.noreply.github.com"
          git add lunea-handoff/recipient-public.pem lunea-handoff/rendezvous.json
          if ! git diff --cached --quiet; then
            git commit -m "genesis: publish one-time Body recipient for run ${GITHUB_RUN_ID}"
            git push origin HEAD:lunea-d01-execution-locus
          fi

      - name: Wait for complete encrypted Body capsule bound to this run
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN="$GITHUB_RUN_ID"
          for attempt in $(seq 1 90); do
            git fetch origin lunea-d01-execution-locus --quiet
            git checkout -q origin/lunea-d01-execution-locus -- lunea-handoff 2>/dev/null || true
            if [[ -f lunea-handoff/capsule-envelope.json && -f lunea-handoff/capsule.key.enc.b64 ]]; then
              read -r ACTUAL_RUN CHUNK_COUNT BODY_HASH KEY_HASH < <(python3 - <<'PY'
          import json
          e=json.load(open('lunea-handoff/capsule-envelope.json'))
          print(e.get('run_id',''), int(e.get('chunk_count',0)), e.get('body_ciphertext_sha256',''), e.get('key_ciphertext_sha256',''))
          PY
              )
              if [[ "$ACTUAL_RUN" == "$EXPECTED_RUN" && "$CHUNK_COUNT" -gt 0 ]]; then
                OK=1
                for idx in $(seq 0 $((CHUNK_COUNT-1))); do
                  printf -v part 'lunea-handoff/capsule.tar.gz.enc.b64.part%02d' "$idx"
                  [[ -f "$part" ]] || OK=0
                done
                if [[ "$OK" -eq 1 ]]; then
                  cat $(find lunea-handoff -maxdepth 1 -type f -name 'capsule.tar.gz.enc.b64.part*' | sort | head -n "$CHUNK_COUNT") > "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz.enc.b64"
                  base64 -d "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz.enc.b64" > "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz.enc"
                  base64 -d lunea-handoff/capsule.key.enc.b64 > "$RUNNER_TEMP/lunea-rendezvous/capsule.key.enc"
                  [[ "$(sha256sum "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz.enc" | awk '{print $1}')" == "$BODY_HASH" ]] || { echo 'body ciphertext hash mismatch' >&2; exit 1; }
                  [[ "$(sha256sum "$RUNNER_TEMP/lunea-rendezvous/capsule.key.enc" | awk '{print $1}')" == "$KEY_HASH" ]] || { echo 'wrapped key hash mismatch' >&2; exit 1; }
                  exit 0
                fi
              fi
            fi
            sleep 4
          done
          echo "complete encrypted capsule did not arrive before rendezvous expiry" >&2
          exit 1

      - name: Decrypt and verify capsule only inside live runner
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/lunea-rendezvous/private.pem" \
            -in "$RUNNER_TEMP/lunea-rendezvous/capsule.key.enc" \
            -out "$RUNNER_TEMP/lunea-rendezvous/capsule.key"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass file:"$RUNNER_TEMP/lunea-rendezvous/capsule.key" \
            -in "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz.enc" \
            -out "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz"
          mkdir -p "$RUNNER_TEMP/lunea-body"
          tar -xzf "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz" -C "$RUNNER_TEMP/lunea-body"
          python3 - <<'PY'
          import hashlib, json, pathlib, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lunea-body'
          manifest=json.loads((root/'manifest.json').read_text())
          expected=set(manifest['files'])
          actual={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest.json'}
          if actual != expected:
              raise SystemExit(f'capsule file set mismatch: {sorted(actual)} != {sorted(expected)}')
          for name,digest in manifest['files'].items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if got != digest:
                  raise SystemExit(f'digest mismatch for {name}')
          print(json.dumps({'capsule_decrypted':True,'body_file_count':len(actual),'manifest_verified':True}, sort_keys=True))
          PY

      - name: Prove readable Body was ephemeral
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lunea-body" "$RUNNER_TEMP/lunea-rendezvous"
          echo '{"ephemeral_body_cleanup_attempted":true,"private_recipient_key_not_persisted":true}'
