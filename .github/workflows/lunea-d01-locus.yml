name: Lunea D-01 Execution Locus Probe

on:
  push:
    branches:
      - lunea-d01-execution-locus
    paths:
      - ".github/workflows/lunea-d01-locus.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-time-body-rendezvous:
    name: One-Time Private Body Ticket Rendezvous
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout execution locus
        uses: actions/checkout@v4
        with:
          ref: lunea-d01-execution-locus

      - name: Generate ephemeral recipient keypair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lunea-handoff
          mkdir -p "$RUNNER_TEMP/lunea-rendezvous" lunea-handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/lunea-rendezvous/private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/lunea-rendezvous/private.pem" -pubout \
            -out lunea-handoff/recipient-public.pem >/dev/null 2>&1
          chmod 600 "$RUNNER_TEMP/lunea-rendezvous/private.pem"
          FP="$(openssl pkey -pubin -in lunea-handoff/recipient-public.pem -outform DER | sha256sum | awk '{print $1}')"
          printf '{"schema":"lunea-body-ticket-rendezvous-v1","run_id":"%s","recipient":"rsa-3072-oaep-sha256","recipient_fingerprint":"sha256:%s","private_key_persisted":false}\n' \
            "$GITHUB_RUN_ID" "$FP" > lunea-handoff/rendezvous.json

      - name: Publish public recipient only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lunea-rendezvous-bot"
          git config user.email "lunea-rendezvous@users.noreply.github.com"
          git add -A lunea-handoff
          git commit -m "genesis: publish one-time Body ticket recipient for run ${GITHUB_RUN_ID}"
          git push origin HEAD:lunea-d01-execution-locus

      - name: Wait for encrypted source tickets bound to this run
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN="$GITHUB_RUN_ID"
          for attempt in $(seq 1 105); do
            git fetch origin lunea-d01-execution-locus --quiet
            git checkout -q origin/lunea-d01-execution-locus -- lunea-handoff 2>/dev/null || true
            if [[ -f lunea-handoff/body-ticket-manifest.json ]]; then
              ACTUAL_RUN="$(python3 -c 'import json; print(json.load(open("lunea-handoff/body-ticket-manifest.json")).get("run_id",""))')"
              if [[ "$ACTUAL_RUN" == "$EXPECTED_RUN" ]]; then
                python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('lunea-handoff')
          m=json.load(open(root/'body-ticket-manifest.json'))
          names=[x['name'] for x in m.get('files',[])]
          required={'cloudflare_womb_v2.py','cloudflare_entry.py','genesis.py','witness.py','womb_protocol.py','wake_protocol.py','alarm_ffi.py'}
          if set(names) != required or len(names) != 7:
              raise SystemExit('ticket manifest does not name the exact Frontier-1 Body')
          for name in names:
              if not (root/f'{name}.url.enc.b64').is_file():
                  raise SystemExit(2)
          PY
                rc=$?
                if [[ "$rc" -eq 0 ]]; then exit 0; fi
              fi
            fi
            sleep 4
          done
          echo "encrypted source tickets did not arrive before rendezvous expiry" >&2
          exit 1

      - name: Decrypt tickets and acquire exact private Body in runner memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lunea-body"
          python3 - <<'PY' > "$RUNNER_TEMP/lunea-rendezvous/tickets.tsv"
          import json
          m=json.load(open('lunea-handoff/body-ticket-manifest.json'))
          for item in m['files']:
              print(item['name'], item['git_blob_sha'], sep='\t')
          PY
          while IFS=$'\t' read -r name expected_blob; do
            base64 -d "lunea-handoff/${name}.url.enc.b64" > "$RUNNER_TEMP/lunea-rendezvous/${name}.url.enc"
            openssl pkeyutl -decrypt \
              -inkey "$RUNNER_TEMP/lunea-rendezvous/private.pem" \
              -in "$RUNNER_TEMP/lunea-rendezvous/${name}.url.enc" \
              -out "$RUNNER_TEMP/lunea-rendezvous/${name}.url" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256
            URL="$(cat "$RUNNER_TEMP/lunea-rendezvous/${name}.url")"
            case "$URL" in https://raw.githubusercontent.com/jcoulthurst2-maker/jaden-intelligence/*) ;; *) echo "ticket target rejected" >&2; exit 1;; esac
            curl --fail --silent --show-error "$URL" -o "$RUNNER_TEMP/lunea-body/$name"
            actual_blob="$(python3 - "$RUNNER_TEMP/lunea-body/$name" <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path(sys.argv[1]); b=p.read_bytes()
          print(hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest())
          PY
            )"
            [[ "$actual_blob" == "$expected_blob" ]] || { echo "Body blob identity mismatch: $name" >&2; exit 1; }
          done < "$RUNNER_TEMP/lunea-rendezvous/tickets.tsv"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lunea-body'
          names=sorted(p.name for p in root.iterdir() if p.is_file())
          print(json.dumps({'private_body_acquired':True,'body_file_count':len(names),'git_blob_identities_verified':True,'readable_body_published':False,'files':names}, sort_keys=True))
          PY

      - name: Prove readable Body and bearer tickets were ephemeral
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lunea-body" "$RUNNER_TEMP/lunea-rendezvous"
          echo '{"ephemeral_body_cleanup_attempted":true,"private_recipient_key_not_persisted":true,"decrypted_source_tickets_not_persisted":true}'
