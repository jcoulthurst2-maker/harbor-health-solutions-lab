name: Lunea D-01 Execution Locus Probe

on:
  push:
    branches:
      - lunea-d01-execution-locus
    paths:
      - ".github/workflows/lunea-d01-locus.yml"
      - "lunea-handoff/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-time-body-rendezvous:
    name: One-Time Encrypted Body Rendezvous
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout execution locus
        uses: actions/checkout@v4
        with:
          ref: lunea-d01-execution-locus

      - name: Generate ephemeral recipient keypair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lunea-rendezvous" lunea-handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/lunea-rendezvous/private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/lunea-rendezvous/private.pem" -pubout \
            -out lunea-handoff/recipient-public.pem >/dev/null 2>&1
          chmod 600 "$RUNNER_TEMP/lunea-rendezvous/private.pem"
          printf '{"schema":"lunea-body-rendezvous-v1","run_id":"%s","recipient":"rsa-3072","private_key_persisted":false}\n' \
            "$GITHUB_RUN_ID" > lunea-handoff/rendezvous.json

      - name: Publish public recipient only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lunea-rendezvous-bot"
          git config user.email "lunea-rendezvous@users.noreply.github.com"
          git add lunea-handoff/recipient-public.pem lunea-handoff/rendezvous.json
          if ! git diff --cached --quiet; then
            git commit -m "genesis: publish one-time Body recipient for run ${GITHUB_RUN_ID}"
            git push origin HEAD:lunea-d01-execution-locus
          fi

      - name: Wait for encrypted Body capsule bound to this run
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN="$GITHUB_RUN_ID"
          for attempt in $(seq 1 72); do
            git fetch origin lunea-d01-execution-locus --quiet
            git checkout -q origin/lunea-d01-execution-locus -- lunea-handoff 2>/dev/null || true
            if [[ -f lunea-handoff/capsule.tar.gz.enc && -f lunea-handoff/capsule.key.enc && -f lunea-handoff/capsule-envelope.json ]]; then
              ACTUAL_RUN="$(python3 -c 'import json; print(json.load(open("lunea-handoff/capsule-envelope.json"))["run_id"])')"
              [[ "$ACTUAL_RUN" == "$EXPECTED_RUN" ]] || { echo "capsule bound to wrong run" >&2; exit 1; }
              exit 0
            fi
            sleep 5
          done
          echo "encrypted capsule did not arrive before rendezvous expiry" >&2
          exit 1

      - name: Decrypt capsule only inside live runner
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/lunea-rendezvous/private.pem" \
            -in lunea-handoff/capsule.key.enc \
            -out "$RUNNER_TEMP/lunea-rendezvous/capsule.key"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass file:"$RUNNER_TEMP/lunea-rendezvous/capsule.key" \
            -in lunea-handoff/capsule.tar.gz.enc \
            -out "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz"
          mkdir -p "$RUNNER_TEMP/lunea-body"
          tar -xzf "$RUNNER_TEMP/lunea-rendezvous/capsule.tar.gz" -C "$RUNNER_TEMP/lunea-body"
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'lunea-body'
          manifest=json.loads((root/'manifest.json').read_text())
          expected=set(manifest['files'])
          actual={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest.json'}
          if actual != expected:
              raise SystemExit(f'capsule file set mismatch: {sorted(actual)} != {sorted(expected)}')
          for name,digest in manifest['files'].items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if got != digest:
                  raise SystemExit(f'digest mismatch for {name}')
          print(json.dumps({'capsule_decrypted':True,'body_file_count':len(actual),'manifest_verified':True}, sort_keys=True))
          PY

      - name: Prove readable Body was ephemeral
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lunea-body" "$RUNNER_TEMP/lunea-rendezvous"
          echo '{"ephemeral_body_cleanup_attempted":true,"private_recipient_key_not_persisted":true}'
