<script>
const K='solutions-lab-global-v2';let S;try{S=JSON.parse(localStorage.getItem(K))||{done:[],attempt:{},hints:{},def:{},mode:'night'}}catch{S={done:[],attempt:{},hints:{},def:{},mode:'night'}};let DB,SQL,idx=0;
const assist={teach:'Concept explanations + direct examples.',pair:'Collaborative structure; you still write the solution.',night:'Hints only. Enough light to keep moving.',interview:'No solution help; clarification only.',field:'Documentation mindset. No coaching.'};
const missions=[
{id:'Q-001',phase:'QUERY // MONTH 01',title:'Cohort Drift',level:'L1 SIMULATION',demand:'HIGH',proof:'Analytical reasoning',brief:'Enterprise implementation completion has declined for three consecutive cohorts. Leadership thinks customer quality is falling. Prove or disprove that explanation from the operating data.',story:'Sales blames weaker customers. Implementation blames staffing. Product blames integration complexity. You have database access and ninety minutes before the operating review.',criteria:['Identify the completion-rate pattern by cohort.','Separate customer mix from implementation complexity.','Test at least one competing explanation.','Do not claim causality the data cannot support.'],tables:[['implementations','implementation_id, customer_id, cohort_month, integration_tier, status, days_to_complete, owner_id'],['customers','customer_id, customer_segment, region, employee_count, contract_value'],['staffing','owner_id, cohort_month, active_projects, capacity_band']],starter:`-- Understand cohort performance, then test the explanations.\nSELECT cohort_month, COUNT(*) AS implementations\nFROM implementations\nGROUP BY cohort_month\nORDER BY cohort_month;`,hint:{teach:'Calculate completion rate by cohort, then join customer and integration attributes.',pair:'Compare cohort_month with integration_tier and customer_segment.',night:'The denominator matters. Segment before accepting the first explanation.',interview:'Clarification: completion means status = completed.',field:'Use the schema and evidence available.'},valid:(q,r)=>/group\s+by/i.test(q)&&/(join|integration|customer)/i.test(q)&&r.length>0},
{id:'Q-002',phase:'QUERY // MONTH 01',title:'Time to Value',level:'L1 SIMULATION',demand:'HIGH',proof:'Cross-table diagnosis',brief:'New enterprise customers are taking longer to reach first value. Find where the delay is introduced and which population is most exposed.',story:'Customer Success blames training. Product blames API provisioning. Finance cares because renewals correlate with time-to-value.',criteria:['Join customer, deployment, and milestone context.','Identify the stage introducing delay.','Segment the exposed population.','Distinguish bottleneck from correlation.'],tables:[['deployments','deployment_id, customer_id, days_to_first_value, adoption_30d'],['milestone_events','deployment_id, provisioning_delay_days, training_delay_days, data_delay_days'],['customers','customer_id, customer_segment, region, contract_value']],starter:`SELECT c.customer_segment, AVG(d.days_to_first_value) AS avg_days_to_value\nFROM deployments d\nJOIN customers c ON c.customer_id=d.customer_id\nGROUP BY c.customer_segment\nORDER BY avg_days_to_value DESC;`,hint:{teach:'Bring milestone_events into the analysis. The slowest segment is not automatically the cause.',pair:'Compare provisioning, training, and data delays after joining the deployment.',night:'Find the stage, not merely the account.',interview:'days_to_first_value is already calculated.',field:'Use the tables.'},valid:(q,r)=>/join/i.test(q)&&/milestone_events/i.test(q)&&r.length>0},
{id:'Q-003',phase:'QUERY // MONTH 02',title:'Incident Gravity',level:'L2 PRODUCTION ANALOGUE',demand:'HIGH',proof:'Prioritization under noise',brief:'A global integration platform has rising incidents while the SLA dashboard remains mostly green. Identify customers whose incident pattern is becoming structurally dangerous.',story:'Support volume is rising. You need an early-warning view that separates noisy customers from worsening severity.',criteria:['Use window logic or defensible trend comparison.','Separate frequency from severity.','Rank material customer exposure.','Create a result an operator could act on.'],tables:[['incidents','incident_id, customer_id, occurred_at, severity, minutes_to_resolve, source'],['customers','customer_id, customer_segment, region, contract_value']],starter:`WITH ranked AS (\n SELECT customer_id,occurred_at,severity,ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY occurred_at DESC) AS recency_rank\n FROM incidents\n)\nSELECT * FROM ranked WHERE recency_rank<=5;`,hint:{teach:'A count rewards noisy low-severity customers. Combine recency, severity, and trend.',pair:'Compare recent severity to earlier severity per customer.',night:'Green lagging metrics can coexist with deteriorating leading indicators.',interview:'severity is 1 low through 4 critical.',field:'No coaching.'},valid:(q,r)=>/over\s*\(/i.test(q)&&r.length>0},
{id:'Q-004',phase:'QUERY // MONTH 02',title:'Migration Reconciliation',level:'L2 PRODUCTION ANALOGUE',demand:'VERY HIGH',proof:'Migration evidence',brief:'A legacy migration reports 99.2% success. The remaining 0.8% may contain high-value active accounts. Decide whether cutover can proceed.',story:'The vendor wants sign-off. Operations wants to avoid another weekend. You need empirical reconciliation, not reassurance.',criteria:['Identify missing or duplicated records.','Reconcile active/high-value accounts separately.','Quantify unresolved exposure.','Make an evidence-based cutover recommendation.'],tables:[['legacy_accounts','account_id, active_flag, account_value, region'],['target_accounts','target_row_id, account_id, active_flag, account_value, migrated_at']],starter:`SELECT l.account_id,l.account_value,t.account_id AS migrated_account_id\nFROM legacy_accounts l\nLEFT JOIN target_accounts t ON t.account_id=l.account_id\nWHERE t.account_id IS NULL\nORDER BY l.account_value DESC;`,hint:{teach:'Start with an anti-join for missing records; separately check duplicates.',pair:'LEFT JOIN for missing, then GROUP BY target account_id HAVING COUNT(*) > 1.',night:'99.2% is a population statistic. Risk lives in the 0.8%.',interview:'active_flag = 1 means active.',field:'Reconcile the systems.'},valid:(q,r)=>/(left\s+join|not\s+exists)/i.test(q)&&r.length>0}
];
const caps=[['I','QUERY',18,'SQL, Postgres reasoning, joins, CTEs, windows, data quality.','ACTIVE'],['II','COMPUTE',6,'Python, pandas, automation, transformation, testing.','QUEUED'],['III','CONNECT',4,'REST, JSON, OAuth, webhooks, Postman, integration patterns.','QUEUED'],['IV','DEPLOY',3,'Git, Azure, IAM, secrets, logging, monitoring, production hygiene.','QUEUED'],['V','INTELLIGENCE',7,'LLM APIs, RAG, tools, agents, evaluation, human authority.','QUEUED'],['VI','OPERATE',62,'Discovery, requirements, rollout, adoption, recovery, economics, executive communication.','TRANSFERABLE']];
const markets=[['Tokyo','Solutions / FDE / Technical Implementation','APIs, enterprise deployment, Japanese customer work'],['London','Solutions / Technical Consulting / AI Deployment','Architecture, regulated systems, client delivery'],['Nairobi','Fintech / Data / Solutions / Transformation','Payments, logistics, reliability, constraint-aware operations'],['Port of Spain','Digital Transformation / Data / Enterprise Systems','Financial services, energy, regional implementation'],['Global Remote','Implementation Engineering / Solutions / AI Ops','Production ownership, APIs, async delivery, measurable outcomes']];
const seed=`CREATE TABLE implementations(implementation_id INTEGER,customer_id INTEGER,cohort_month TEXT,integration_tier TEXT,status TEXT,days_to_complete INTEGER,owner_id INTEGER);INSERT INTO implementations VALUES(1,101,'2026-05','standard','completed',21,1),(2,102,'2026-05','standard','completed',24,2),(3,103,'2026-05','complex','completed',39,3),(4,104,'2026-05','standard','completed',20,1),(5,105,'2026-05','complex','in_progress',NULL,2),(6,106,'2026-06','standard','completed',23,1),(7,107,'2026-06','complex','completed',44,2),(8,108,'2026-06','complex','in_progress',NULL,3),(9,109,'2026-06','complex','in_progress',NULL,3),(10,110,'2026-06','standard','completed',27,2),(11,111,'2026-07','complex','in_progress',NULL,1),(12,112,'2026-07','complex','completed',49,2),(13,113,'2026-07','complex','in_progress',NULL,3),(14,114,'2026-07','standard','completed',25,1),(15,115,'2026-07','complex','in_progress',NULL,2);CREATE TABLE customers(customer_id INTEGER,customer_segment TEXT,region TEXT,employee_count INTEGER,contract_value INTEGER);INSERT INTO customers VALUES(101,'mid-market','US',800,90000),(102,'enterprise','UK',5000,240000),(103,'enterprise','JP',9200,410000),(104,'mid-market','KE',1200,110000),(105,'enterprise','TT',4300,220000),(106,'mid-market','US',900,95000),(107,'enterprise','JP',12000,480000),(108,'enterprise','UK',7100,320000),(109,'mid-market','KE',1500,130000),(110,'enterprise','TT',3800,205000),(111,'enterprise','JP',14000,520000),(112,'enterprise','UK',8200,350000),(113,'mid-market','KE',1800,145000),(114,'mid-market','US',1000,104000),(115,'enterprise','TT',5100,260000);CREATE TABLE staffing(owner_id INTEGER,cohort_month TEXT,active_projects INTEGER,capacity_band TEXT);INSERT INTO staffing VALUES(1,'2026-05',5,'normal'),(2,'2026-05',5,'normal'),(3,'2026-05',4,'normal'),(1,'2026-06',5,'normal'),(2,'2026-06',6,'high'),(3,'2026-06',6,'high'),(1,'2026-07',5,'normal'),(2,'2026-07',6,'high'),(3,'2026-07',5,'normal');CREATE TABLE deployments(deployment_id INTEGER,customer_id INTEGER,days_to_first_value INTEGER,adoption_30d REAL);INSERT INTO deployments VALUES(201,101,18,.71),(202,102,26,.63),(203,103,41,.48),(204,106,21,.68),(205,107,47,.42),(206,108,39,.51),(207,110,31,.57);CREATE TABLE milestone_events(deployment_id INTEGER,provisioning_delay_days INTEGER,training_delay_days INTEGER,data_delay_days INTEGER);INSERT INTO milestone_events VALUES(201,2,1,2),(202,5,4,3),(203,18,4,7),(204,3,2,2),(205,22,3,9),(206,16,5,8),(207,8,4,5);CREATE TABLE incidents(incident_id INTEGER,customer_id INTEGER,occurred_at TEXT,severity INTEGER,minutes_to_resolve INTEGER,source TEXT);INSERT INTO incidents VALUES(1,101,'2026-08-01',1,18,'api'),(2,101,'2026-08-09',1,22,'api'),(3,101,'2026-08-18',2,37,'webhook'),(4,101,'2026-08-25',2,42,'webhook'),(5,103,'2026-08-02',1,25,'api'),(6,103,'2026-08-08',2,44,'api'),(7,103,'2026-08-13',2,51,'auth'),(8,103,'2026-08-19',3,89,'auth'),(9,103,'2026-08-25',4,166,'auth'),(10,107,'2026-08-03',2,38,'api'),(11,107,'2026-08-11',2,41,'api'),(12,107,'2026-08-19',2,43,'api'),(13,107,'2026-08-24',2,40,'api'),(14,108,'2026-08-05',1,17,'webhook'),(15,108,'2026-08-12',3,94,'webhook'),(16,108,'2026-08-21',3,101,'webhook'),(17,108,'2026-08-27',4,190,'webhook');CREATE TABLE legacy_accounts(account_id INTEGER,active_flag INTEGER,account_value INTEGER,region TEXT);INSERT INTO legacy_accounts VALUES(5001,1,420000,'JP'),(5002,1,190000,'UK'),(5003,0,12000,'US'),(5004,1,610000,'TT'),(5005,1,80000,'KE'),(5006,0,9000,'US'),(5007,1,370000,'JP');CREATE TABLE target_accounts(target_row_id INTEGER,account_id INTEGER,active_flag INTEGER,account_value INTEGER,migrated_at TEXT);INSERT INTO target_accounts VALUES(1,5001,1,420000,'2026-08-27'),(2,5002,1,190000,'2026-08-27'),(3,5003,0,12000,'2026-08-27'),(4,5005,1,80000,'2026-08-27'),(5,5006,0,9000,'2026-08-27'),(6,5007,1,370000,'2026-08-27'),(7,5007,1,370000,'2026-08-27');`;
function save(){localStorage.setItem(K,JSON.stringify(S));radius()}function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function m(){return missions[idx]}
async function boot(){try{SQL=await initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.11.0/${f}`});DB=new SQL.Database();DB.run(seed);document.querySelector('#engine').textContent='runtime ready';document.querySelector('#engine').style.color='var(--g)'}catch(e){document.querySelector('#engine').textContent='runtime failed';document.querySelector('#engine').style.color='var(--r)'}}
function renderMission(){let x=m(),h=document.querySelector('#mission');h.innerHTML=`<div class="head"><div><div class="eyebrow">${x.phase} // ${x.id}</div><h1>${x.title}</h1><p class="lead">${x.brief}</p></div><div class="meta"><div><span>Evidence</span><span>${x.level}</span></div><div><span>Demand</span><span>${x.demand}</span></div><div><span>Lane</span><span>Solutions / FDE</span></div><div><span>Proof</span><span>${x.proof}</span></div></div></div><div class="signals"><div class="sig"><small>MISSION</small><strong>${idx+1}/${missions.length}</strong></div><div class="sig"><small>ASSIST</small><strong>${S.mode.toUpperCase()}</strong></div><div class="sig"><small>STATUS</small><strong>${S.done.includes(x.id)?'EVIDENCED':'ACTIVE'}</strong></div><div class="sig"><small>MARKET MAP</small><strong>EMPLOYER-MAPPED</strong></div></div><div class="work"><section class="panel brief"><div class="label">BRIEFING</div><h3>Situation</h3><p>${x.story}</p><div class="divider"></div><div class="label">WHAT COUNTS</div><ul>${x.criteria.map(c=>`<li>${c}</li>`).join('')}</ul><div class="divider"></div><div class="label">AVAILABLE TABLES</div>${x.tables.map(t=>`<div class="schema"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</section><section class="panel"><div class="termbar"><span>postgres_analogue // sqlite runtime</span><span id="engine">${DB?'runtime ready':'booting…'}</span></div><textarea id="sql" spellcheck="false">${esc(S.attempt[x.id]?.q||x.starter)}</textarea><div class="actions"><button class="btn primary" id="run">RUN QUERY</button><button class="btn" id="hint">HINT</button><button class="btn ghost" id="reset">RESET</button></div><div id="feedback" class="box" hidden></div><div id="hintbox" class="box" hidden></div><div id="result" class="result"><div class="empty">Run a query when ready. Cmd/Ctrl + Enter also works.</div></div></section></div><div class="defenses"><section class="panel def"><div class="label">TECHNICAL DEFENSE</div><p>Explain query logic, assumptions, edge cases, and production validation.</p><textarea id="tech" placeholder="Your technical defense…">${esc(S.def[x.id]?.tech||'')}</textarea></section><section class="panel def"><div class="label">EXECUTIVE DEFENSE</div><p>Explain what changed, why it matters, and what should happen next.</p><textarea id="exec" placeholder="Your executive defense…">${esc(S.def[x.id]?.exec||'')}</textarea></section></div><div class="submit"><button class="btn primary" id="submit">SUBMIT EVIDENCE</button><span id="stat" class="tiny muted">Completion requires a valid query plus both defenses.</span></div>`;if(!DB)boot();document.querySelector('#run').onclick=run;document.querySelector('#hint').onclick=hint;document.querySelector('#reset').onclick=()=>document.querySelector('#sql').value=x.starter;document.querySelector('#submit').onclick=submit;document.querySelector('#sql').onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();run()}};['tech','exec'].forEach(id=>document.querySelector('#'+id).oninput=defs);if(S.done.includes(x.id)){document.querySelector('#stat').textContent='EVIDENCED — query + both defenses recorded';document.querySelector('#stat').style.color='var(--g)'}}
function defs(){let x=m();S.def[x.id]={tech:document.querySelector('#tech').value,exec:document.querySelector('#exec').value};save()}
function run(){let x=m(),q=document.querySelector('#sql').value,f=document.querySelector('#feedback');if(!DB){f.hidden=false;f.className='box bad';f.textContent='Runtime is still loading.';return}try{let z=DB.exec(q),cols=z[0]?.columns||[],rows=z[0]?.values||[],ok=x.valid(q,rows);document.querySelector('#result').innerHTML=cols.length?`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Executed. No table returned.</div>';f.hidden=false;f.className='box '+(ok?'good':'bad');f.textContent=ok?'Evidence pattern detected. Now defend what the result proves.':'Push beyond the first answer. This mission has not met the employer-grade evidence standard yet.';S.attempt[x.id]={q,ok,rows:rows.length,at:new Date().toISOString()};save()}catch(e){f.hidden=false;f.className='box bad';f.textContent='SQL error: '+e.message}}
function hint(){let x=m(),b=document.querySelector('#hintbox');S.hints[x.id]=(S.hints[x.id]||0)+1;save();b.hidden=false;b.textContent=x.hint[S.mode]||x.hint.night}
function submit(){defs();let x=m(),a=S.attempt[x.id],d=S.def[x.id]||{},s=document.querySelector('#stat');if(!a?.ok){s.textContent='Not yet: query evidence standard not met.';s.style.color='var(--r)';return}if((d.tech||'').trim().length<80||(d.exec||'').trim().length<60){s.textContent='Not yet: both defenses need more substance.';s.style.color='var(--a)';return}if(!S.done.includes(x.id))S.done.push(x.id);save();s.textContent='Evidence recorded. This now counts toward demonstrated capability.';s.style.color='var(--g)';renderProof()}
function radius(){let h=Object.values(S.hints||{}).reduce((a,b)=>a+b,0),v=Math.max(18,Math.min(82,Math.round(18+(S.done.length/missions.length)*54-Math.min(8,h*1.2))));document.querySelector('#radius').textContent=v+'%';document.querySelector('#meter').style.width=v+'%'}
function renderCaps(){document.querySelector('#capabilities').innerHTML=`<div class="page"><div class="eyebrow">CAPABILITY MAP // NOT COURSE PROGRESS</div><h2>What can you do today?</h2><p>The Lab scores demonstrated capability, not hours watched. Technical depth rises while implementation strength gets converted into globally legible evidence.</p></div><div class="grid">${caps.map(c=>`<article class="card"><div class="eyebrow">PHASE ${c[0]} // ${c[4]}</div><span class="score">${c[2]}%</span><h3>${c[1]}</h3><p>${c[3]}</p><div class="tags"><span class="tag ${c[4]=='ACTIVE'?'live':''}">${c[4]}</span></div></article>`).join('')}</div>`}
function renderProof(){document.querySelector('#proof').innerHTML=`<div class="page"><div class="eyebrow">PROOF LEDGER // DISCLOSED EVIDENCE</div><h2>No invented portfolio credit.</h2><p>L0 drills, L1 simulations, L2 production analogues, and L3 real deployments stay visibly distinct.</p></div><div class="proof">${missions.map(x=>`<article><div class="level">${x.level}</div><div><h3>${x.id} · ${x.title}</h3><p>${x.brief}</p>${S.attempt[x.id]?`<div class="tags"><span class="tag">${S.attempt[x.id].rows||0} rows</span><span class="tag">${S.hints[x.id]||0} hints</span><span class="tag">${x.proof}</span></div>`:''}</div><div class="status">${S.done.includes(x.id)?'EVIDENCED':'NOT YET'}</div></article>`).join('')}</div>`}
function renderMarket(){document.querySelector('#market').innerHTML=`<div class="page"><div class="eyebrow">EMPLOYER DEMAND // CURRICULUM INPUT</div><h2>The market decides what matters.</h2><p>The mature Lab will ingest live target roles and reweight training demand. The lane is solutions, forward deployment, technical implementation, AI deployment, and transformation — not generic junior engineering.</p></div>${markets.map(x=>`<div class="marketrow"><strong>${x[0]}</strong><span>${x[1]}</span><span>${x[2]}</span></div>`).join('')}`}
function renderWorld(){let cities=[['TOKYO','29%','Technical depth must rise sharply; Japanese becomes a parallel capability, not decoration.'],['LONDON','43%','Hybrid operator-builder becomes compelling when technical proof is undeniable.'],['NAIROBI','47%','Systems + data + deployment evidence travels well across fintech and logistics.'],['PORT OF SPAIN','58%','Existing operating experience transfers directly; technical proof expands the ceiling.']];let jp=[['要件定義','requirements definition','yōken teigi'],['実装','implementation','jissō'],['障害','incident / failure','shōgai'],['データ連携','data integration','dēta renkei'],['検証','validation','kenshō'],['本番環境','production environment','honban kankyō']];document.querySelector('#world').innerHTML=`<div class="page"><div class="eyebrow">WORLD // DEPLOYABILITY</div><h2>Drop into an unfamiliar system.</h2><p>Global readiness rises when technical proof, implementation judgment, language, and real deployment evidence remove the reasons a company would default to a local candidate.</p></div><div class="grid">${cities.map(c=>`<article class="city"><span class="score">${c[1]}</span><div class="eyebrow">TARGET MARKET</div><h3>${c[0]}</h3><p>${c[2]}</p></article>`).join('')}</div><div class="jp"><div class="eyebrow">TECHNICAL JAPANESE // PARALLEL TRACK</div>${jp.map(j=>`<div class="jprow"><strong>${j[0]}</strong><span>${j[1]}</span><span>${j[2]}</span></div>`).join('')}</div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelector('#'+b.dataset.v).classList.add('active')});let mode=document.querySelector('#mode');mode.value=S.mode;function modeSet(){S.mode=mode.value;document.querySelector('#modecopy').textContent=assist[S.mode];save();renderMission()}mode.onchange=modeSet;document.querySelector('#modecopy').textContent=assist[S.mode];renderMission();renderCaps();renderProof();renderMarket();renderWorld();radius();
</script></body></html>
